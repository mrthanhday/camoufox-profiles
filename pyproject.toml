[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camoufox-profiles"
version = "0.1.0"
description = "Persistent antidetect browser profile management for Camoufox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "camoufox[geoip]",
    "aiosqlite>=0.20.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/camoufox_profiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
